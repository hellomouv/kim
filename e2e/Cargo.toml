[package]
name = "kim-e2e"
version = "0.0.0"
description = "End-to-end suite for Kim tools. Runs only via `cargo xtask e2e` (AGENTS.md §4)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
# step66 injects obscure keys and checks the input desktop with the Ddalgak library.
ddalgak = { path = "../crates/ddalgak" }
# step74 drives the Ddalgak editor's own code headlessly (egui_kittest) against the real test host.
ddalgak-editor = { path = "../crates/ddalgak-editor" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
egui_kittest = "=0.37.0"
kim = { path = "../crates/kim" }
# step57 decodes Noeul's quick-saved PNG to check that a redaction left no original pixel.
png = { version = "0.18.1", default-features = false }
# step07 validates real --json output with xtask/src/jsonschema.rs (needs regex).
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
# step15 feeds `subak attach` output into the Subak client view and renders it headlessly.
subak-term = { path = "../crates/subak-term" }
# step73 posts synthetic session messages to the Ddalgak test host's own hidden window.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
