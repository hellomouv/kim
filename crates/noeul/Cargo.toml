[package]
name = "noeul"
version = "0.0.1"
description = "Noeul: small native screenshot and floating-pin tool (pre-alpha, Steps 49-59)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "noeul"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# CLI parsing with contract-shaped errors (docs/CLI_CONTRACT.md), as in `kim`.
clap = { version = "4.6.7", features = ["derive"] }
# Shortcuts: manifest, user layer, conflicts and the `RegisterHotKey` backend (ADR 0017).
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
# PNG for Copy (the clipboard's `PNG` format) and Save (NOEUL-FR-030/031, Step 51): pure Rust,
# MIT/Apache-2.0, already in the workspace lock with its dependencies (no new crate).
png = { version = "0.18.1", default-features = false }
# Decoding pasted and dropped image files (Step 55, NOEUL-FR-072, ADR 0047): pure Rust, MIT OR
# Apache-2.0, already in the workspace lock (through eframe) with PNG only. Only the formats
# Noeul pins are enabled: JPEG (zune-jpeg), GIF (gif), TIFF (tiff) and the decoders `image`
# carries itself (BMP, ICO, TGA). No default features: no rayon, no AVIF/EXR/WebP, no encoders
# beyond what these formats imply. Every decode runs with explicit limits (`crate::decode`).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tga", "tiff"] }
# Converting a picture's embedded ICC profile to sRGB (Step 55, ADR 0047): BSD-3-Clause OR
# Apache-2.0, the colour engine `image` already depends on (same version and features; no new
# crate in the lock).
moxcms = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
# Integrity of the opt-in history and pin backup files (Step 60); already in the workspace lock.
sha2 = "0.11.1"
# The --json envelope and IPC v1 messages.
serde_json = "1.0.154"
# config.toml (NOEUL-FR-102); already in the workspace lock.
# Only the features the lock already has (no `std`: its weak features would add crates to the lock).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[target."cfg(windows)".dependencies]
# Plain Win32 (ADR 0023): GDI screen capture into memory, layered pin windows, the optional
# notification-area icon, the clipboard (read on paste, written on Copy only), the save dialog and
# the Pictures folder (Step 51), the per-user named pipe with peer identity checks, input-desktop
# and session checks; window rectangles (DWM extended frame bounds) and UI Automation element
# rectangles for hover detection (Step 52, COM through raw vtables). No GUI framework, no hook,
# no service. Step 58: the display configuration (rotation, advanced colour) read with
# QueryDisplayConfig (Devices_Display), the pointer drawn into a capture with
# GetCursorInfo/DrawIconEx, and `PrintWindow` (Storage_Xps) for the measurement example only
# (ADR 0050). Features add no crate to the lock.
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# tests compile xtask/src/jsonschema.rs (the schema-check validator), which needs `regex`;
# already in the workspace lock, test-only, never shipped.
regex = "1.13.1"
