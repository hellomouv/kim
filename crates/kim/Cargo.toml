[package]
name = "kim"
version = "0.0.1"
description = "Kim manager: explicit, user-controlled catalog and installer for Kim tools"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kim"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
ed25519-dalek = "3.0.0"
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
# The CLI contract tests compile xtask/src/jsonschema.rs (the schema-check validator), which
# needs `regex`; already in the workspace lock for xtask, test-only, never shipped.
regex = "1.13.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dev-dependencies]
# tests/cli_headless.rs runs kim inside a job object to prove headless commands start no process.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
