[package]
name = "ddalgak"
version = "0.0.1"
description = "Ddalgak: a native Windows-first automation engine (headless CLI and tray-app engine host)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# Two binaries in one package (ADR 0022): the headless CLI and the tray app that owns the engine.
# Neither links a GUI toolkit; the tray icon uses the Win32 shell API directly (ADR 0024). The
# rule editor is its own package and process, `ddalgak-editor` (Step 74, ADR 0049), so this
# package stays on the headless list of `cargo xtask deps-check`.
[[bin]]
name = "ddalgak"
path = "src/main.rs"

[[bin]]
name = "ddalgak-gui"
path = "src/bin/ddalgak-gui.rs"

[lints]
workspace = true

[dependencies]
# Key syntax, reserved chords, the hotkey manifest and user layer, `RegisterHotKey` chord mapping
# (docs/HOTKEY_CONTRACT.md, ADR 0017).
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
# The typed rules document (docs/DDALGAK_RULE_MODEL.md; unknown fields kept with `flatten`).
serde = { version = "1.0.229", features = ["derive"] }
# The --json envelope (docs/CLI_CONTRACT.md §7), the local IPC messages and rules.json.
serde_json = "1.0.154"
# The `ddalgak-rules-v1` schema is applied at run time with xtask/src/jsonschema.rs, the
# validator of `cargo xtask schema-check` (ADR 0028), which needs `regex`. Only the features the
# schema's patterns use (`\s`, `\S`, `(?i)`).
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Launch-consent fingerprints (DDALGAK_RULE_MODEL §6.2, `consent_stale`), as `kim` and xtask.
sha2 = "0.11.1"

[target."cfg(windows)".dependencies]
# The engine host (ADR 0024): low-level keyboard hook and SendInput, RegisterHotKey on the host
# window, the tray icon, WinEvent context tracking (focus, IME windows), session lock
# notifications, the single-instance mutex, the identity-checked named pipe, the opt-in HKCU Run
# value, integrity levels and process times; since Step 69 the clipboard (paste with restore),
# global memory for clipboard data and the IME window (hotstrings step aside in Hangul mode);
# since Step 70 process creation, the shell's `open` (ShellExecuteExW, which wants COM on the
# calling thread) and icon extraction for the editor's program preview; since Step 71 the monitor
# layout with each monitor's DPI and per-monitor DPI awareness for the mouse actions (HiDpi).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# tests/cli.rs validates `ddalgak --json` output with xtask/src/jsonschema.rs and rewrites
# machine-specific names in the blessed examples (all regex features).
regex = "1.13.1"

[build-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
