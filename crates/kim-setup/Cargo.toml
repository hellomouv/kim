[package]
name = "kim-setup"
version = "0.0.1"
description = "Kim-Setup.exe: the one-step, per-user Windows installer of Kim Manager (installs nothing else)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kim-setup"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Kim's own install record and running-program detection (never stops a program).
kim = { version = "0.0.1", path = "../kim" }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
# Step 43 (ADR 0072): a plain Win32 progress window, the Start Menu shortcut (IShellLinkW through
# COM), the per-user Apps & Features entry (HKCU registry), the architecture check, launching
# Kim Manager. No GUI toolkit: the installer stays small.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1.0.154"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
