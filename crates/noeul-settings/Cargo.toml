[package]
name = "noeul-settings"
version = "0.0.1"
description = "Noeul's settings window (ADR 0093): the Kim design system in egui; every change is the documented `noeul` command"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "noeul-settings"
path = "src/main.rs"

[dependencies]
noeul = { version = "0.0.1", path = "../noeul" }
kim-ui = { version = "0.0.1", path = "../kim-ui" }
kim-design = { version = "0.0.1", path = "../kim-design" }
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = "=0.37.0"

[build-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
